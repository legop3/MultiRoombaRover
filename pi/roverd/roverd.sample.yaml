# Sample configuration for roverd
name: roomba-alpha
description: "Loves corners, hates cords."
color: "#4DB6AC"
serverUrl: ws://control-server.local:8080/rover
serial:
  device: /dev/ttyAMA0
  baud: 115200
brc:
  gpioPin: 4
  gpioChip: gpiochip0
  pulseEvery: 1m
  pulseWidth: 1s
battery:
  full: 2068
  warn: 1700
  urgent: 1650
maxWheelSpeed: 350
media:
  publishUrl: srt://192.168.0.86:9000?streamid=#!::r=roomba-alpha,m=publish&latency=10&mode=caller&transtype=live&pkt_size=1316
  audioForwardUrl: srt://192.168.0.86:9000?streamid=#!::r=roomba-alpha-fwd,m=request&latency=10&mode=caller&transtype=live&pkt_size=1316
  publishPort: 9000
  # Default assumes camera is mounted upside down; set false for upright mounts.
  cameraInverted: true
  videoBitrate: 2000000
  manage: true
  service: video-publisher.service
  healthUrl: ""
  healthInterval: 30s
cameraServo:
  enabled: false
  pin: 12
  freqHz: 50
  cycleLen: 20000
  minPulseUs: 900
  maxPulseUs: 2100
  invert: false
  minAngle: -15
  maxAngle: 30
  homeAngle: 0
  nudgeDegrees: 2
  allowRawPulse: false
audio:
  captureEnabled: false
  captureDevice: hw:0,0
  playbackDevice: forward
  ttsEnabled: false
  defaultEngine: flite
  defaultVoice: rms
  defaultPitch: 50
horn:
  enabled: false
  volume: 0.25
  sampleRate: 48000
  channels: 1
  sineGain: 1.0
  sawGain: 0.7
  maxDuration: 1.2s
nightVision:
  enabled: true
  gpioPin: 22
  gpioChip: gpiochip0
  initialOn: true
autoSideBrush:
  enabled: true
  speed: 20
private:
  enabled: false
  safety:
    speedLimitEnabled: false
    speedLimitMaxWheelSpeed: 250
    hardOvercurrentEnabled: false
    overcurrentStopMs: 300
    hardBumpEnabled: false
    bumpBackoffSpeed: 250
    bumpBackoffMs: 350
    cliffEnabled: false
    cliffBackoffSpeed: 250
    cliffBackoffMs: 500
    triggerCooldownMs: 800
