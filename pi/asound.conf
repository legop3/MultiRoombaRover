# Use the Google Voice HAT soundcard as the primary device by name (card id is "sndrpigooglevoi")
options snd_rpi_googlevoicehat_soundcard index=0

# Mix multiple playback clients in software with a fixed low-cost format.
pcm.dmixer {
    type dmix
    ipc_key 1024
    ipc_perm 0666
    slave {
        pcm "hw:0,0"
        format S16_LE
        rate 16000
        channels 1
        period_time 0
        period_size 256
        buffer_size 1024
    }
}

# TTS volume control (used by default playback path).
pcm.tts_softvol {
    type softvol
    slave.pcm "dmixer"
    control {
        name "TTSMaster"
        card 0
    }
    min_dB -60.0
    max_dB 12.0
}

# Horn volume control.
pcm.horn_softvol {
    type softvol
    slave.pcm "dmixer"
    control {
        name "HornMaster"
        card 0
    }
    min_dB -60.0
    max_dB 12.0
}

# Forwarded audio volume control.
pcm.forward_softvol {
    type softvol
    slave.pcm "dmixer"
    control {
        name "ForwardMaster"
        card 0
    }
    min_dB -60.0
    max_dB 12.0
}

# Per-source playback PCMs.
pcm.tts {
    type plug
    slave.pcm "tts_softvol"
}

pcm.horn {
    type plug
    slave.pcm "horn_softvol"
}

pcm.forward {
    type plug
    slave.pcm "forward_softvol"
}

# Capture alias used by rover config defaults.
pcm.rovermic {
    type plug
    slave.pcm "hw:0,0"
}

# Defaults: TTS direct playback + raw capture on the HAT.
pcm.!default {
    type asym
    playback.pcm "tts"
    capture.pcm "rovermic"
}

ctl.!default {
    type hw
    card 0
}
